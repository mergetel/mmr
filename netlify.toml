# A static site with no build step. Netlify serves the repo root as it is.
[build]
  publish = "."
  command = ""

# The leaderboard changes once a day, so don't let a CDN hold yesterday's drama.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
